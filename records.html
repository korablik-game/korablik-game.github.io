<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081a22">
<title>Рекорды — Бумажный кораблик</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout: one centered column — header with tabs, podium of three, then the live ranked list. Single dark world like the game. */
:root{--night:#081a22;--panel:#0b2630;--panel2:#0d2c37;--paper:#f3eee2;--lantern:#ffb347;--ink:#d9e6e4;--muted:#8fb0ad;--good:#5fe0a8;--line:#ffffff1f;
  --gold:#ffcf4a;--silver:#d6dde3;--bronze:#d9925a;
  --display:"Unbounded",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font-family:var(--body)}
body{background:radial-gradient(ellipse 120% 60% at 70% 0%,#12424f 0%,var(--night) 60%) fixed}
.wrap{max-width:640px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--lantern);font-weight:800}
h1{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.02}
h1 span{color:var(--lantern)}
.play{font-family:var(--display);font-size:15px;padding:13px 24px;border-radius:999px;background:var(--lantern);color:#2a1600;text-decoration:none;box-shadow:0 0 0 5px #ffb34722}
.play:focus-visible,.tabs button:focus-visible{outline:2px solid var(--lantern);outline-offset:3px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:#0b263099;border:1px solid var(--line)}
.tabs button{font-family:var(--display);font-size:13px;padding:10px 14px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--lantern);color:#2a1600}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 1.6s infinite}
.live.off i{background:#6d8f8c;box-shadow:none;animation:none}
@keyframes blink{50%{opacity:.3}}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center;min-width:0}
.pod .medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#1b1408;font-size:17px}
.pod .nm{font-weight:800;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.pod.p1{padding-top:26px;border-color:#ffcf4a66;background:linear-gradient(180deg,#ffcf4a1f,var(--panel))}
.pod.p1 .medal{width:52px;height:52px;font-size:22px;background:var(--gold);box-shadow:0 0 22px #ffcf4a88}
.pod.p1 .sc{color:var(--gold);font-size:22px}
.pod.p2 .medal{background:var(--silver)}
.pod.p3 .medal{background:var(--bronze)}
.pod.empty{opacity:.35}
.list{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 16px;background:var(--panel);align-items:center;font-variant-numeric:tabular-nums}
.row:nth-child(even){background:var(--panel2)}
.row .pl{font-family:var(--display);color:var(--muted);font-size:15px}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:600}
.row .sc{font-family:var(--display);font-size:15px}
.row.up{animation:rise 1.8s ease-out}
@keyframes rise{from{background:#ffb34755}}
.msg{color:var(--muted);font-size:15px;line-height:1.5;text-align:center;padding:24px 8px}
.foot{font-size:12px;color:#6d8f8c;text-align:center}
@media (max-width:420px){.podium{gap:6px}.pod{padding:12px 4px}.pod .nm{font-size:13px}}
@media (prefers-reduced-motion:reduce){.live i,.row.up{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Бумажный кораблик</div>
      <h1>Таблица <span>рекордов</span></h1>
    </div>
    <a class="play" href="./">Играть</a>
  </header>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="all" aria-selected="true">За всё время</button>
      <button role="tab" data-tab="day" aria-selected="false">Заплыв дня</button>
    </div>
    <div class="live off" id="live"><i></i><span id="liveTxt">Подключаемся…</span></div>
  </div>
  <div class="podium" id="podium"></div>
  <div class="list" id="list"></div>
  <div class="msg" id="msg" hidden></div>
  <div class="foot" id="foot"></div>
</div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const todayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let tab='all',unsub=null,prevPlaces={};
function showMsg(t){$('msg').hidden=!t;$('msg').textContent=t||''}
function setLive(on,t){$('live').classList.toggle('off',!on);$('liveTxt').textContent=t}
const cfg=window.FIREBASE_CONFIG||{};
if(!window.firebase||!cfg.apiKey||!cfg.projectId){setLive(false,'Не настроено');showMsg('Таблица рекордов заработает, когда в файл config.js будут вписаны данные проекта Firebase.');return}
firebase.initializeApp(cfg);const db=firebase.firestore();
function subscribe(){
  if(unsub)unsub();prevPlaces={};
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  setLive(false,'Загружаем…');
  const col=db.collection('scores');
  const q=tab==='all'?col.orderBy('best','desc').limit(100):col.where('day','==',todayStr());
  unsub=q.onSnapshot(snap=>{
    let rows=snap.docs.map(d=>{const v=d.data();return{id:d.id,name:String(v.name||'Капитан').slice(0,16),v:(tab==='all'?v.best:v.dayScore)|0}}).filter(r=>r.v>0);
    if(tab==='day')rows.sort((a,b)=>b.v-a.v);
    let place=0,prev=null;rows.forEach((r,i)=>{if(r.v!==prev){place=i+1;prev=r.v}r.place=place});
    render(rows);
    setLive(true,'Обновляется сама · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  },()=>{setLive(false,'Нет связи');showMsg('Не удалось загрузить рекорды. Проверьте интернет и правила базы данных Firebase.')});
}
function render(rows){
  const had=Object.keys(prevPlaces).length>0,next={};
  const pod=$('podium');pod.innerHTML='';
  for(const i of [1,0,2]){const r=rows[i];const el=document.createElement('div');el.className='pod p'+(i+1)+(r?'':' empty');
    const m=document.createElement('div');m.className='medal';m.textContent=r?r.place:i+1;
    const n=document.createElement('div');n.className='nm';n.textContent=r?r.name:'—';
    const s=document.createElement('div');s.className='sc';s.textContent=r?r.v:'';
    el.append(m,n,s);pod.appendChild(el)}
  const list=$('list');list.innerHTML='';
  rows.slice(3).forEach(r=>{const el=document.createElement('div');el.className='row';
    if(had&&(prevPlaces[r.id]===undefined||prevPlaces[r.id]>r.place))el.classList.add('up');
    el.innerHTML='<span class="pl"></span><span class="nm"></span><span class="sc"></span>';
    el.children[0].textContent=r.place;el.children[1].textContent=r.name;el.children[2].textContent=r.v;list.appendChild(el)});
  list.hidden=rows.length<=3;
  rows.forEach(r=>next[r.id]=r.place);prevPlaces=next;
  showMsg(rows.length?'':(tab==='all'?'Пока никто не играл. Станьте первым!':'Сегодня заплыв дня ещё никто не проплыл.'));
  $('foot').textContent=rows.length?(tab==='all'?'Игроков в таблице: '+rows.length+(rows.length>=100?'+':''):'Сегодня участвовали: '+rows.length+'. Заплыв дня обновляется в полночь.'):'';
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;subscribe()});
subscribe();
})();
</script>
</body>
</html>
